<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiamondIQ — Register</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">⚾ DiamondIQ</a>
</header>
<main id="register">
  <h1>Create Your Account</h1>
  <form method="post" action="/api/auth/register">
    <label for="reg-user">Username</label>
    <input type="text" id="reg-user" name="username" required minlength="3" maxlength="30">
    <label for="reg-email">Email</label>
    <input type="email" id="reg-email" name="email" required>
    <label for="reg-pass">Password (8+ characters)</label>
    <input type="password" id="reg-pass" name="password" required minlength="8">
    <button type="submit">Register</button>
    <p id="register-error" role="alert"></p>
  </form>
  <p>Already have an account? <a href="login.html">Log in</a></p>
</main>
<footer><p>DiamondIQ — Five Experts. One Pitch.</p></footer>
</body>
</html>
