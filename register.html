<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiamondIQ — Register</title>
<meta name="description" content="Create your DiamondIQ account.">
<script>
(function(){try{if(localStorage.getItem('diamondiq_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="ui.js" defer></script>
</head>
<body>
<a class="skip-link" href="#register">Skip to content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect x="14" y="2.5" width="16.2" height="16.2" rx="2.5" transform="rotate(45 14 2.5)" stroke="currentColor" stroke-width="2.2"/>
        <circle cx="14" cy="14" r="3" fill="currentColor"/>
      </svg>
      <span>DiamondIQ</span>
    </a>

    <nav id="site-nav" class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="scenarios.html">Scenarios</a>
      <a href="compare.html">Compare</a>
      <a href="playbook.html">My Playbook</a>
      <a href="login.html">Log In</a>
    </nav>

    <div class="header-actions">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
        <span>Dark Mode</span>
      </button>
      <button type="button" id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="register" class="container">
  <div class="auth-shell card">
    <h1>Create Your Account</h1>
    <p style="color:var(--text-secondary);">Make a free account to bookmark plays and build your own playbook.</p>
    <form class="form-stack" method="post" action="/api/auth/register" onsubmit="return false;">
      <div class="field">
        <label for="reg-user">Username</label>
        <input type="text" id="reg-user" name="username" placeholder="3–30 characters" required minlength="3" maxlength="30">
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="reg-pass">Password (8+ characters)</label>
        <input type="password" id="reg-pass" name="password" placeholder="At least 8 characters" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
      <p id="register-error" class="feedback-banner" role="alert"></p>
    </form>
    <p style="margin-top:1.25rem;margin-bottom:0;color:var(--text-secondary);">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p style="margin:0;">DiamondIQ — Five Experts. One Pitch.</p>
    <nav class="footer-nav" aria-label="Footer">
      <a href="index.html">Home</a>
      <a href="scenarios.html">Scenarios</a>
      <a href="compare.html">Compare</a>
      <a href="playbook.html">My Playbook</a>
      <a href="login.html">Log In</a>
    </nav>
  </div>
</footer>
</body>
</html>
